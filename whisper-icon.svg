<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c5565"/><stop offset="0.55" stop-color="#333a46"/><stop offset="1" stop-color="#242932"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f5fa"/><stop offset="1" stop-color="#c3ccd9"/>
    </linearGradient>
    <linearGradient id="accent" gradientUnits="userSpaceOnUse" x1="0" y1="156" x2="0" y2="316"><stop offset="0" stop-color="#6cc4ff"/><stop offset="1" stop-color="#2f86e6"/></linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#11141a" flood-opacity="0.42"/>
    </filter>
  </defs>
  <!-- house style: graphite ground, glyphs held inside the 96-416 keyline, 24px strokes, one accent -->
  <rect width="512" height="512" rx="112" fill="url(#ground)"/>
  <g filter="url(#lift)">
    <!-- speech bubble: what goes in is speech -->
    <path d="M144 120 h224 a40 40 0 0 1 40 40 v152 a40 40 0 0 1 -40 40 h-148 l-50 42 v-42 h-26 a40 40 0 0 1 -40 -40 v-152 a40 40 0 0 1 40 -40 Z" fill="url(#light)" stroke="url(#light)" stroke-width="8" stroke-linejoin="round"/>
    <!-- waveform: the audio being transcribed -->
    <g stroke="url(#accent)" stroke-width="24" stroke-linecap="round">
      <line x1="160" y1="208" x2="160" y2="264"/>
      <line x1="208" y1="180" x2="208" y2="292"/>
      <line x1="256" y1="156" x2="256" y2="316"/>
      <line x1="304" y1="184" x2="304" y2="288"/>
      <line x1="352" y1="212" x2="352" y2="260"/>
    </g>
  </g>
</svg>
