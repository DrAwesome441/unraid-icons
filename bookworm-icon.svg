<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c5565"/><stop offset="0.55" stop-color="#333a46"/><stop offset="1" stop-color="#242932"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f5fa"/><stop offset="1" stop-color="#c3ccd9"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b8e862"/><stop offset="1" stop-color="#78b52c"/></linearGradient>
    <linearGradient id="accentDim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fc23e"/><stop offset="1" stop-color="#5d8f1e"/></linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#11141a" flood-opacity="0.42"/>
    </filter>
  </defs>
  <!-- house style: graphite ground, glyphs held inside the 96-416 keyline, 24px strokes, one accent -->
  <rect width="512" height="512" rx="112" fill="url(#ground)"/>
  <g filter="url(#lift)" transform="translate(-20 0)">
    <!-- the book: cover, spine and page edge -->
    <path d="M152 96 h168 a24 24 0 0 1 24 24 v264 a24 24 0 0 1 -24 24 h-168 a24 24 0 0 1 -24 -24 v-264 a24 24 0 0 1 24 -24 Z" fill="url(#accent)"/>
    <path d="M152 96 h20 v312 h-20 a24 24 0 0 1 -24 -24 v-264 a24 24 0 0 1 24 -24 Z" fill="url(#accentDim)"/>
    <rect x="172" y="364" width="156" height="28" rx="6" fill="url(#light)"/>
    <g stroke="#5d8f1e" stroke-width="12" stroke-linecap="round" opacity="0.7">
      <line x1="212" y1="160" x2="304" y2="160"/>
      <line x1="212" y1="192" x2="276" y2="192"/>
    </g>
    <!-- chat badge: it talks in Discord -->
    <path d="M300 236 h80 a40 40 0 0 1 40 40 v32 a40 40 0 0 1 -40 40 h-44 l-36 28 v-28 a40 40 0 0 1 -40 -40 v-32 a40 40 0 0 1 40 -40 Z" fill="url(#light)" stroke="#2b313c" stroke-width="12" stroke-linejoin="round"/>
    <g fill="#4a5262">
      <circle cx="304" cy="292" r="11"/><circle cx="340" cy="292" r="11"/><circle cx="376" cy="292" r="11"/>
    </g>
  </g>
</svg>
