<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c5565"/><stop offset="0.55" stop-color="#333a46"/><stop offset="1" stop-color="#242932"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f5fa"/><stop offset="1" stop-color="#c3ccd9"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9b7bff"/><stop offset="1" stop-color="#6a3fe0"/></linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#11141a" flood-opacity="0.42"/>
    </filter>
  </defs>
  <!-- house style: graphite ground, glyphs held inside the 96-416 keyline, 24px strokes, one accent -->
  <rect width="512" height="512" rx="112" fill="url(#ground)"/>
  <g filter="url(#lift)">
    <!-- hard cover peeking out under the pages -->
    <path d="M256 196 Q180 146 92 176 V386 Q180 356 256 410 Q332 356 420 386 V176 Q332 146 256 196 Z" fill="url(#accent)"/>
    <!-- pages -->
    <path d="M256 178 Q180 128 104 160 V360 Q180 328 256 378 Z" fill="url(#light)"/>
    <path d="M256 178 Q332 128 408 160 V360 Q332 328 256 378 Z" fill="url(#light)"/>
    <!-- gutter -->
    <path d="M256 180 V376" stroke="#a9b3c3" stroke-width="4" stroke-linecap="round"/>
    <!-- text -->
    <g stroke="#9aa5b8" stroke-width="12" stroke-linecap="round" fill="none">
      <path d="M131.4 197.1 Q183 185.4 234.7 211.6"/>
      <path d="M131.4 237.1 Q183 225.4 234.7 251.6"/>
      <path d="M131.4 277.1 Q183 265.4 234.7 291.6"/>
      <path d="M131.4 317.1 Q161.8 310.2 192.2 316.5"/>
      <path d="M380.6 197.1 Q329 185.4 277.3 211.6"/>
      <path d="M380.6 237.1 Q329 225.4 277.3 251.6"/>
      <path d="M380.6 277.1 Q329 265.4 277.3 291.6"/>
      <path d="M380.6 317.1 Q350.2 310.2 319.8 316.5"/>
    </g>
  </g>
</svg>
