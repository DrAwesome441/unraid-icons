<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c5565"/><stop offset="0.55" stop-color="#333a46"/><stop offset="1" stop-color="#242932"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2f5fa"/><stop offset="1" stop-color="#c3ccd9"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8fb6"/><stop offset="1" stop-color="#e0457d"/></linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#11141a" flood-opacity="0.42"/>
    </filter>
  </defs>
  <!-- house style: graphite ground, glyphs held inside the 96-416 keyline, 24px strokes, one accent -->
  <rect width="512" height="512" rx="112" fill="url(#ground)"/>
  <g filter="url(#lift)" transform="translate(-14 -4)">
    <!-- the e-reader -->
    <rect x="128" y="96" width="200" height="320" rx="34" fill="url(#light)"/>
    <rect x="152" y="124" width="152" height="232" rx="10" fill="#dde2ea"/>
    <g stroke="#9aa5b8" stroke-width="12" stroke-linecap="round">
      <line x1="178" y1="160" x2="278" y2="160"/>
      <line x1="178" y1="196" x2="278" y2="196"/>
      <line x1="178" y1="232" x2="278" y2="232"/>
      <line x1="178" y1="268" x2="238" y2="268"/>
    </g>
    <rect x="208" y="378" width="40" height="10" rx="5" fill="#a9b3c3"/>
    <!-- feed badge: the books arrive by feed -->
    <circle cx="340" cy="348" r="72" fill="url(#accent)" stroke="#2b313c" stroke-width="12"/>
    <g fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round">
      <path d="M314 318 a56 56 0 0 1 56 56"/>
      <path d="M314 290 a84 84 0 0 1 84 84" opacity="0"/>
      <path d="M314 342 a32 32 0 0 1 32 32"/>
    </g>
    <circle cx="320" cy="368" r="9" fill="#ffffff"/>
  </g>
</svg>
