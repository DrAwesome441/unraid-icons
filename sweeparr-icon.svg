<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c5565"/>
      <stop offset="0.55" stop-color="#333a46"/>
      <stop offset="1" stop-color="#242932"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#ffbb46"/>
      <stop offset="1" stop-color="#ef8f0c"/>
    </linearGradient>
    <linearGradient id="amberDim" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#e79a1c"/>
      <stop offset="1" stop-color="#c9760a"/>
    </linearGradient>
    <linearGradient id="handle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8edf5"/>
      <stop offset="1" stop-color="#aab4c4"/>
    </linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#11141a" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#ground)"/>

  <!-- motion: the sweep the broom is making, kept faint so it reads as ground not object -->
  <g stroke="#e8edf5" stroke-linecap="round" fill="none" opacity="0.20">
    <path d="M126 300 q40 26 92 30" stroke-width="15"/>
    <path d="M112 356 q52 32 118 34" stroke-width="15"/>
  </g>

  <g filter="url(#lift)" transform="translate(-8 -10) rotate(-22 256 256)">
    <!-- handle -->
    <rect x="240" y="104" width="32" height="200" rx="16" fill="url(#handle)"/>
    <!-- ferrule binding handle to head -->
    <rect x="212" y="292" width="88" height="30" rx="10" fill="url(#amberDim)"/>
    <!-- bristle head, flaring out to the sweeping edge -->
    <path d="M214 318 h84 l40 100 a10 10 0 0 1 -9 14 h-146 a10 10 0 0 1 -9 -14 Z" fill="url(#amber)"/>
    <!-- bristle separations -->
    <g stroke="url(#amberDim)" stroke-width="9" stroke-linecap="round" opacity="0.85">
      <path d="M240 330 l-12 88"/>
      <path d="M272 330 l12 88"/>
    </g>
  </g>
</svg>
