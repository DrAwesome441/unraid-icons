<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c5565"/><stop offset="0.55" stop-color="#333a46"/><stop offset="1" stop-color="#242932"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2f8"/><stop offset="1" stop-color="#b9c3d2"/>
    </linearGradient>
    <linearGradient id="teal" gradientUnits="userSpaceOnUse" x1="0" y1="300" x2="0" y2="384">
      <stop offset="0" stop-color="#4fe0cb"/><stop offset="1" stop-color="#1fa894"/>
    </linearGradient>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#11141a" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#ground)"/>
  <g filter="url(#lift)">
    <!-- the picture: a video frame -->
    <rect x="80" y="108" width="352" height="296" rx="30" fill="url(#screen)"/>
    <!-- subtitle text being read off the frame -->
    <g stroke="url(#teal)" stroke-width="24" stroke-linecap="round">
      <line x1="168" y1="318" x2="344" y2="318"/>
      <line x1="200" y1="362" x2="312" y2="362"/>
    </g>
    <!-- scan corners: OCR -->
    <g stroke="#2a303a" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M130 312 v-26 h26"/>
      <path d="M382 312 v-26 h-26"/>
      <path d="M130 368 v26 h26"/>
      <path d="M382 368 v26 h-26"/>
    </g>
  </g>
</svg>
